$schema: "http://json-schema.org/draft-07/schema#"
title: Rule file
type: object
additionalProperties: false
required:
  - name
  - filter
  - action
  - branch
  - commit_message
  - pr
properties:
  name:
    type: string
    minLength: 1
  filter:
    $ref: "#/definitions/filter"
  subset:
    type: object
    additionalProperties: false
    required: [column, equals]
    properties:
      column:
        type: string
      equals:
        type: string
  action:
    $ref: "#/definitions/action"
  source_branch:
    type: string
    minLength: 1
    description: >
      Overrides config/repos.csv's default_branch for every repo in this
      rule's run: filter reads, the new branch's base tip, and the PR base
      all use this branch name instead. Omit to use each repo's own
      default_branch column.
  branch:
    type: string
    minLength: 1
  commit_message:
    type: string
    minLength: 1
  pr:
    type: object
    additionalProperties: false
    required: [title, body_template]
    properties:
      title:
        type: string
        minLength: 1
      body_template:
        type: string
        minLength: 1
      description:
        type: string

definitions:
  filter:
    oneOf:
      - $ref: "#/definitions/filter_path_exists"
      - $ref: "#/definitions/filter_path_absent"
      - $ref: "#/definitions/filter_content_match"
      - $ref: "#/definitions/filter_content_absent"
      - $ref: "#/definitions/filter_pr_open_on_branch"
      - $ref: "#/definitions/filter_all_of"

  filter_all_of:
    type: object
    additionalProperties: false
    required: [type, filters]
    properties:
      type: { const: all_of }
      filters:
        type: array
        minItems: 2
        items: { $ref: "#/definitions/filter" }
        description: >
          Evaluated in order, each against only the repos that survived the
          previous one -- e.g. [pr_open_on_branch, content_match] first
          narrows to repos with that PR open, then checks file content only
          on that narrowed set.

  filter_path_exists:
    type: object
    additionalProperties: false
    required: [type, path]
    properties:
      type: { const: path_exists }
      path: { type: string, minLength: 1 }

  filter_path_absent:
    type: object
    additionalProperties: false
    required: [type, path]
    properties:
      type: { const: path_absent }
      path: { type: string, minLength: 1 }

  filter_content_match:
    type: object
    additionalProperties: false
    required: [type, path, pattern]
    properties:
      type: { const: content_match }
      path: { type: string, minLength: 1 }
      pattern: { type: string, minLength: 1 }

  filter_content_absent:
    type: object
    additionalProperties: false
    required: [type, path, pattern]
    properties:
      type: { const: content_absent }
      path: { type: string, minLength: 1 }
      pattern: { type: string, minLength: 1 }

  filter_pr_open_on_branch:
    type: object
    additionalProperties: false
    required: [type, branch]
    properties:
      type: { const: pr_open_on_branch }
      branch:
        type: string
        minLength: 1
        description: >
          Matches repos that currently have an open PR whose head is this
          branch name. Not about file content -- has no `path`.

  action:
    oneOf:
      - $ref: "#/definitions/action_add_file"
      - $ref: "#/definitions/action_overwrite_file"
      - $ref: "#/definitions/action_regex_replace"
      - $ref: "#/definitions/action_anchor_insert"
      - $ref: "#/definitions/action_block_insert"
      - $ref: "#/definitions/action_fix_line_endings"

  action_add_file:
    type: object
    additionalProperties: false
    required: [type, path, source_template_path]
    properties:
      type: { const: add_file }
      path: { type: string, minLength: 1 }
      source_template_path: { type: string, minLength: 1 }
      overwrite: { type: boolean }

  action_overwrite_file:
    type: object
    additionalProperties: false
    required: [type, path, source_template_path]
    properties:
      type: { const: overwrite_file }
      path: { type: string, minLength: 1 }
      source_template_path: { type: string, minLength: 1 }

  action_regex_replace:
    type: object
    additionalProperties: false
    required: [type, path, pattern, replacement]
    properties:
      type: { const: regex_replace }
      path: { type: string, minLength: 1 }
      pattern: { type: string, minLength: 1 }
      replacement: { type: string }
      require_match: { type: boolean }

  action_anchor_insert:
    type: object
    additionalProperties: false
    required: [type, path, anchor_pattern, lines]
    properties:
      type: { const: anchor_insert }
      path: { type: string, minLength: 1 }
      anchor_pattern: { type: string, minLength: 1 }
      lines:
        type: array
        items: { type: string }
        minItems: 1
      position:
        enum: [before, after]
      skip_if_present: { type: string }
      require_anchor: { type: boolean }

  action_block_insert:
    type: object
    additionalProperties: false
    required: [type, path, start_pattern, end_pattern, lines]
    properties:
      type: { const: block_insert }
      path: { type: string, minLength: 1 }
      start_pattern: { type: string, minLength: 1 }
      end_pattern: { type: string, minLength: 1 }
      lines:
        type: array
        items: { type: string }
        minItems: 1
      position:
        enum: [before, after]
      require_match: { type: boolean }
      skip_if_present: { type: string }

  action_fix_line_endings:
    type: object
    additionalProperties: false
    required: [type, path]
    properties:
      type: { const: fix_line_endings }
      path: { type: string, minLength: 1 }
